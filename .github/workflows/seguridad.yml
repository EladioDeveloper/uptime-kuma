# Controles DevSecOps agregados en la auditoría (MCW-621).
# - Actions fijadas por SHA completo y binarios verificados por SHA-256 (VERSIONES.md del curso).
# - permissions: {} a nivel de workflow; cada job pide solo lo que usa.
# - Ningún job usa pull_request_target ni interpola ${{ github.event.* }} dentro de run:.
name: seguridad

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: seguridad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  # Dimensión 3: secretos en TODO el historial. Lo ya revisado está en .gitleaksignore;
  # cualquier coincidencia nueva hace fallar el job.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (verificado)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks && rm gl.tgz gitleaks
      - name: gitleaks sobre todo el historial
        run: gitleaks git --log-opts="--all" --redact --gitleaks-ignore-path .gitleaksignore --verbose .

  # Dimensión 2: bloquea PRs que agregan dependencias con CVE altos o críticos.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          show-patched-versions: true

  # Dimensiones 2 y 6: CVE en package-lock (bloquea críticos con parche disponible),
  # Dockerfiles (informativo) y SBOM CycloneDX.
  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Trivy (verificado)
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy && sudo install trivy /usr/local/bin/trivy && rm trivy.tgz trivy
      - name: SCA - CVE críticos en dependencias (bloqueante)
        run: trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 .
      - name: IaC - Dockerfiles (informativo)
        run: |
          trivy config --file-patterns "dockerfile:docker/dockerfile" --severity HIGH,CRITICAL --format table . | tee trivy-config.txt
      - name: SBOM CycloneDX
        run: trivy fs --format cyclonedx --output sbom.cdx.json .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-y-sbom
          path: |
            trivy-config.txt
            sbom.cdx.json

  # Dimensión 9: auditoría estática de los workflows. Falla con hallazgos de severidad alta.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          advanced-security: false
          min-severity: high

  # Dimensión 5: DAST con ZAP baseline contra la imagen oficial 2.5.9 fijada por digest.
  dast-zap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      uptime-kuma:
        image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
        ports:
          - 3001:3001
    steps:
      - name: Esperar a que la app responda
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3001/ && exit 0
            sleep 5
          done
          echo "La app no respondió" && exit 1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3001
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline

  # Dimensión 7: procedencia SLSA firmada (Sigstore) del paquete de código y del SBOM.
  # Verificable con: gh attestation verify <archivo> --repo EladioDeveloper/uptime-kuma
  procedencia:
    needs: trivy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-y-sbom
      - name: Empaquetar el código fuente
        run: |
          git archive --format=tar.gz --prefix=uptime-kuma/ -o uptime-kuma-src.tar.gz HEAD
          sha256sum uptime-kuma-src.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Procedencia SLSA del paquete
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: uptime-kuma-src.tar.gz
      - name: Atestación del SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: uptime-kuma-src.tar.gz
          sbom-path: sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paquete-firmado
          path: uptime-kuma-src.tar.gz
